<!DOCTYPE html>
<html lang="tr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#050505"
    >

    <meta
        name="apple-mobile-web-app-capable"
        content="yes"
    >

    <meta
        name="apple-mobile-web-app-status-bar-style"
        content="black-translucent"
    >

    <meta
        name="apple-mobile-web-app-title"
        content="JARVIS"
    >

    <title>JARVIS</title>


    <link
        rel="manifest"
        href="./manifest.json"
    >


    <link
        rel="stylesheet"
        href="./css/style.css"
    >

</head>


<body>

    <main class="jarvis-app">


        <!-- =====================================
             JARVIS HEADER
        ====================================== -->

        <header class="jarvis-header">

            <div class="jarvis-status">

                <span
                    class="status-dot"
                    id="status-dot"
                ></span>

                <span>
                    JARVIS
                </span>

            </div>


            <div
                id="status-text"
                class="status-text"
            >
                Sistemler çevrimiçi.
            </div>

        </header>



        <!-- =====================================
             KONUŞMA ALANI
        ====================================== -->

        <section
            id="conversation"
            class="conversation"
            aria-live="polite"
        ></section>



        <!-- =====================================
             KOMUT ALANI
        ====================================== -->

        <section class="command-area">


            <div class="command-box">

                <input
                    id="command"
                    type="text"
                    autocomplete="off"
                    autocapitalize="sentences"
                    spellcheck="true"
                    placeholder="JARVIS'e bir şey sor..."
                    aria-label="JARVIS komutu"
                >


                <button
                    id="send"
                    type="button"
                    aria-label="Gönder"
                >
                    Gönder
                </button>

            </div>



            <!-- =================================
                 SESLİ KONUŞMA
            ================================== -->

            <button
                id="voice-button"
                type="button"
                aria-label="Sesli konuşma"
            >
                🎙️
            </button>


        </section>


    </main>



    <!-- =========================================
         JARVIS JAVASCRIPT SİSTEMİ
         
         YÜKLEME SIRASI ÖNEMLİDİR
    ========================================== -->


    <!-- 1. HAFIZA -->

    <script
        src="./js/memory.js?v=5"
    ></script>



    <!-- 2. AI CORE -->

    <script
        src="./js/ai-core.js?v=5"
    ></script>



    <!-- 3. ARAÇLAR -->

    <script
        src="./js/tools.js?v=5"
    ></script>



    <!-- 4. GÜVENLİK -->

    <script
        src="./js/security.js?v=5"
    ></script>



    <!-- 5. KENDİNİ GELİŞTİRME -->

    <script
        src="./js/self-improve.js?v=5"
    ></script>



    <!-- 6. SES SİSTEMİ -->

    <script
        src="./js/voice.js?v=5"
    ></script>



    <!-- 7. ANA UYGULAMA -->

    <script
        src="./js/app.js?v=5"
    ></script>



</body>

</html>
