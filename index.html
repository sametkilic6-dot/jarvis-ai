<!DOCTYPE html>
<html lang="tr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#050505"
    >

    <meta
        name="apple-mobile-web-app-capable"
        content="yes"
    >

    <meta
        name="apple-mobile-web-app-status-bar-style"
        content="black-translucent"
    >

    <meta
        name="apple-mobile-web-app-title"
        content="JARVIS"
    >

    <title>JARVIS</title>

    <link
        rel="manifest"
        href="./manifest.json"
    >

    <link
        rel="stylesheet"
        href="./css/style.css"
    >

</head>


<body>

    <main class="jarvis-app">

        <header class="jarvis-header">

            <div class="jarvis-status">

                <span
                    class="status-dot"
                    id="status-dot"
                ></span>

                <span>
                    JARVIS
                </span>

            </div>

            <div
                id="status-text"
                class="status-text"
            >
                Sistemler çevrimiçi.
            </div>

        </header>


        <section
            id="conversation"
            class="conversation"
            aria-live="polite"
        ></section>


        <section class="command-area">

            <div class="command-box">

                <input
                    id="command"
                    type="text"
                    autocomplete="off"
                    autocapitalize="sentences"
                    placeholder="JARVIS'e bir şey sor..."
                    aria-label="JARVIS komutu"
                >

                <button
                    id="send"
                    type="button"
                    aria-label="Gönder"
                >
                    Gönder
                </button>

            </div>


            <button
                id="voice-button"
                type="button"
                aria-label="Sesli konuşma"
            >
                🎙️
            </button>

        </section>

    </main>


    <!--
        JARVIS JAVASCRIPT SIRASI
    -->

    <script
        src="./js/memory.js"
    ></script>

    <script
        src="./js/ai-core.js"
    ></script>

    <script
        src="./js/tools.js"
    ></script>

    <script
        src="./js/security.js"
    ></script>

    <script
        src="./js/self-improve.js"
    ></script>

    <script
        src="./js/voice.js"
    ></script>

    <script
        src="./js/app.js"
    ></script>


</body>

</html>
