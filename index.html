<!DOCTYPE html>
<html lang="tr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#03050a"
    >

    <meta
        name="mobile-web-app-capable"
        content="yes"
    >

    <meta
        name="apple-mobile-web-app-capable"
        content="yes"
    >

    <meta
        name="apple-mobile-web-app-status-bar-style"
        content="black-translucent"
    >

    <title>JARVIS AI</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

    <!-- WebLLM -->
    <script
        type="module"
        src="https://esm.run/@mlc-ai/web-llm"
    ></script>

</head>


<body>

<div id="app">


    <!-- ÜST BAR -->

    <header class="top-bar">

        <div class="brand">

            <span class="brand-dot"></span>

            JARVIS

        </div>


        <div id="connection-status">

            ÇEVRİMİÇİ

        </div>

    </header>



    <!-- ANA ALAN -->

    <main>


        <!-- JARVIS ÇEKİRDEĞİ -->

        <section class="core-section">

            <div class="core">

                <div
                    class="core-ring ring-1"
                ></div>


                <div
                    class="core-ring ring-2"
                ></div>


                <div class="core-center">

                    J

                </div>

            </div>


            <h1>

                JARVIS

            </h1>


            <p id="system-status">

                Sistem başlatılıyor...

            </p>


            <!-- MODEL DURUMU -->

            <div
                id="model-status"
                style="
                    margin-top:10px;
                    font-size:11px;
                    color:#657285;
                "
            >

                AI modeli hazırlanıyor...

            </div>


            <!-- MODEL İNDİRME -->

            <div
                id="model-progress"
                style="
                    display:none;
                    margin-top:10px;
                    font-size:11px;
                    color:#00d9ff;
                "
            >

                Model indiriliyor...

            </div>

        </section>



        <!-- KONUŞMA -->

        <section id="conversation">


            <div class="message jarvis">


                <div class="message-name">

                    JARVIS

                </div>


                <div>

                    Merhaba Samet.

                    Gerçek AI çekirdeğimi

                    hazırlıyorum.

                </div>


            </div>


        </section>



        <!-- KOMUT ALANI -->

        <section class="command-area">


            <input
                id="command"
                type="text"
                placeholder="JARVIS'e bir komut ver..."
                autocomplete="off"
            >


            <button
                id="send"
                type="button"
            >

                ➤

            </button>


            <button
                id="microphone"
                type="button"
            >

                🎙️

            </button>


        </section>


    </main>



    <!-- ALT BİLGİ -->

    <footer>

        <span>

            JARVIS AI

        </span>


        <span>

            Türkçe • Yerel AI

        </span>

    </footer>


</div>



<!-- =========================================
     JARVIS CORE
     ========================================= -->


<script src="js/security.js"></script>

<script src="js/memory.js"></script>

<script src="js/tools.js"></script>

<script src="js/voice.js"></script>

<script src="js/self-improve.js"></script>


<!-- AI CORE -->

<script src="js/ai-core.js"></script>


<!-- APP -->

<script src="js/app.js"></script>


</body>

</html>
