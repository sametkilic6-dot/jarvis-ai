<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#0a0a0a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>JARVIS AI</title>
    <link rel="manifest" href="manifest.json" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: #0a0a0a; color: #e0e0e0; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        .header { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; background: #111; border-bottom: 1px solid #222; flex-shrink: 0; min-height: 56px; }
        .header-left { display: flex; align-items: center; gap: 10px; }
        .logo { font-size: 20px; font-weight: 700; color: #00d4ff; letter-spacing: 1px; text-shadow: 0 0 20px rgba(0,212,255,0.2); }
        .logo span { font-weight: 300; color: #888; font-size: 14px; }
        .status { display: flex; align-items: center; gap: 6px; font-size: 12px; color: #888; }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #555; transition: all 0.3s; }
        .status-dot.status-online { background: #00d4ff; box-shadow: 0 0 12px rgba(0,212,255,0.4); }
        .status-dot.status-processing { background: #ffaa00; box-shadow: 0 0 12px rgba(255,170,0,0.4); animation: pulse 0.8s infinite; }
        .status-dot.status-listening { background: #ff4444; box-shadow: 0 0 20px rgba(255,68,68,0.6); animation: pulse 0.5s infinite; }
        .status-dot.status-error { background: #ff4444; box-shadow: 0 0 12px rgba(255,68,68,0.4); }
        .status-dot.status-connecting { background: #ffaa00; animation: pulse 0.8s infinite; }
        @keyframes pulse { 0%,100%{opacity:1;transform:scale(1);} 50%{opacity:0.5;transform:scale(0.8);} }
        .conversation { flex: 1; overflow-y: auto; padding: 16px; padding-bottom: 20px; display: flex; flex-direction: column; gap: 12px; background: #0d0d0d; scroll-behavior: smooth; }
        .conversation::-webkit-scrollbar { width: 4px; }
        .conversation::-webkit-scrollbar-track { background: transparent; }
        .conversation::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }
        .message { display: flex; gap: 10px; max-width: 88%; animation: fadeIn 0.3s ease; }
        .message.user { align-self: flex-end; flex-direction: row-reverse; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .message .avatar { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 16px; flex-shrink: 0; background: #1a1a1a; border: 1px solid #2a2a2a; }
        .message.user .avatar { background: #1a2a3a; border-color: #00d4ff33; }
        .message .content { display: flex; flex-direction: column; gap: 4px; }
        .message .text { background: #1a1a1a; padding: 10px 14px; border-radius: 14px; font-size: 15px; line-height: 1.5; word-wrap: break-word; border: 1px solid #222; }
        .message.user .text { background: #0a2a3a; border-color: #00d4ff44; color: #e8f4ff; }
        .message .meta { font-size: 10px; color: #555; padding: 0 4px; user-select: none; }
        .message.user .meta { text-align: right; }
        .message.typing .text { background: #151515; color: #888; animation: typingPulse 1s infinite; }
        @keyframes typingPulse { 0%,100%{opacity:0.5;} 50%{opacity:1;} }
        .input-area { display: flex; gap: 10px; padding: 12px 16px; background: #111; border-top: 1px solid #222; flex-shrink: 0; align-items: center; }
        .input-area textarea { flex: 1; background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 24px; padding: 10px 16px; color: #e0e0e0; font-size: 15px; font-family: inherit; resize: none; outline: none; min-height: 44px; max-height: 120px; line-height: 1.4; transition: border-color 0.3s; }
        .input-area textarea:focus { border-color: #00d4ff88; }
        .input-area textarea:disabled { opacity: 0.5; }
        .input-area button { width: 44px; height: 44px; border: none; border-radius: 50%; background: #00d4ff; color: #0a0a0a; font-size: 20px; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
        .input-area button:hover { transform: scale(1.05); box-shadow: 0 0 24px rgba(0,212,255,0.3); }
        .input-area button:active { transform: scale(0.95); }
        .input-area button:disabled { opacity: 0.4; cursor: not-allowed; }
        .input-area .voice-btn { background: #2a2a2a; color: #888; }
        .input-area .voice-btn:hover { background: #ff4444; color: white; box-shadow: 0 0 24px rgba(255,68,68,0.3); }
        .input-area .voice-btn.listening { background: #ff4444; color: white; animation: voicePulse 0.8s infinite; }
        @keyframes voicePulse { 0%,100%{box-shadow:0 0 12px rgba(255,68,68,0.3);} 50%{box-shadow:0 0 32px rgba(255,68,68,0.6);} }
        @media (max-width: 480px) { .message { max-width: 92%; } .message .text { font-size: 14px; padding: 8px 12px; } .input-area { padding: 8px 12px; gap: 8px; } .input-area textarea { font-size: 14px; padding: 8px 14px; min-height: 38px; } .input-area button { width: 38px; height: 38px; font-size: 17px; } .header { padding: 8px 12px; min-height: 48px; } .logo { font-size: 17px; } .status { font-size: 11px; } }
    </style>
</head>
<body>
    <header class="header">
        <div class="header-left"><div class="logo">JARVIS <span>AI</span></div></div>
        <div class="status">
            <span class="status-dot status-connecting" id="status-dot"></span>
            <span id="status-text">Bağlanıyor...</span>
        </div>
    </header>
    <div class="conversation" id="conversation"></div>
    <div class="input-area">
        <button class="voice-btn" id="voice-button" title="Sesli Komut">🎤</button>
        <textarea id="command" placeholder="Mesajınızı yazın..." rows="1" autofocus></textarea>
        <button id="send" title="Gönder">➤</button>
    </div>

    <!-- SÜRÜM 11 -->
    <script src="js/memory.js?v=11"></script>
    <script src="js/ai-core.js?v=11"></script>
    <script src="js/tools.js?v=11"></script>
    <script src="js/security.js?v=11"></script>
    <script src="js/self-improve.js?v=11"></script>
    <script src="js/voice.js?v=11"></script>
    <script src="js/app.js?v=11"></script>

    <script>
        document.getElementById('command').addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = Math.min(this.scrollHeight, 120) + 'px';
        });
        console.log('🚀 JARVIS v11 yükleniyor...');
    </script>
</body>
</html>
