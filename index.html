<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#05070d">

    <title>JARVIS AI</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div id="app">

        <header class="top-bar">
            <div class="brand">
                <span class="brand-dot"></span>
                JARVIS
            </div>

            <div id="connection-status">
                ÇEVRİMİÇİ
            </div>
        </header>


        <main>

            <section class="core-section">

                <div class="core">
                    <div class="core-ring ring-1"></div>
                    <div class="core-ring ring-2"></div>

                    <div class="core-center">
                        J
                    </div>
                </div>

                <h1>JARVIS</h1>

                <p id="system-status">
                    Sistemler hazır.
                </p>

            </section>


            <section id="conversation">

                <div class="message jarvis">

                    <div class="message-name">
                        JARVIS
                    </div>

                    <div>
                        Merhaba Samet.
                        Sistemler çevrimiçi.
                        Seni dinliyorum.
                    </div>

                </div>

            </section>


            <section class="command-area">

                <input
                    id="command"
                    type="text"
                    placeholder="JARVIS'e bir komut ver..."
                    autocomplete="off"
                >

                <button id="send" aria-label="Gönder">
                    ➤
                </button>

                <button id="microphone" aria-label="Sesli komut">
                    🎙️
                </button>

            </section>

        </main>


        <footer>

            <span>JARVIS AI</span>

            <span>
                Türkçe • Güvenli Mod
            </span>

        </footer>

    </div>


    <script src="js/app.js"></script>

</body>
</html>
