<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#03050a"
    >

    <meta
        name="apple-mobile-web-app-capable"
        content="yes"
    >

    <meta
        name="apple-mobile-web-app-status-bar-style"
        content="black-translucent"
    >

    <title>JARVIS AI</title>

    <link
        rel="stylesheet"
        href="style.css?v=4"
    >
</head>

<body>

    <div id="app">

        <header class="top-bar">

            <div class="brand">

                <span class="brand-dot"></span>

                JARVIS

            </div>

            <div id="connection-status">
                ÇEVRİMİÇİ
            </div>

        </header>


        <main>

            <section class="core-section">

                <div class="core">

                    <div
                        class="core-ring ring-1"
                    ></div>

                    <div
                        class="core-ring ring-2"
                    ></div>

                    <div class="core-center">
                        J
                    </div>

                </div>

                <h1>
                    JARVIS
                </h1>

                <p id="system-status">
                    Sistemler çevrimiçi.
                </p>

            </section>


            <section id="conversation">

                <div class="message jarvis">

                    <div class="message-name">
                        JARVIS
                    </div>

                    <div>
                        Merhaba Samet.
                        Sistemlerim çevrimiçi.
                    </div>

                </div>

            </section>


            <section class="command-area">

                <input
                    id="command"
                    type="text"
                    placeholder="JARVIS'e bir komut ver..."
                    autocomplete="off"
                >

                <button
                    id="send"
                    type="button"
                >
                    ➤
                </button>

                <button
                    id="microphone"
                    type="button"
                >
                    🎙️
                </button>

            </section>

        </main>


        <footer>

            <span>
                JARVIS AI
            </span>

            <span>
                Türkçe • AI Core
            </span>

        </footer>

    </div>


    <!-- JARVIS DOSYA SIRASI -->

    <script src="js/memory.js?v=4"></script>

    <script src="js/ai-core.js?v=4"></script>

    <script src="js/app.js?v=4"></script>

</body>
</html>
